[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persian-math-intelligence-platform"
version = "0.2.0.dev0"
description = "Production-grade Persian-first mathematical intelligence and tutoring platform."
requires-python = ">=3.11"
dependencies = [
    "sympy>=1.13,<2",
    "pillow>=10,<12",
    "pytesseract>=0.3.13,<1",
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26,<2.3",
    "PyMuPDF>=1.24,<2",
    "python-telegram-bot>=22,<23",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-timeout>=2.3,<3", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
