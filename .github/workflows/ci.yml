name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check .

  format:
    name: Ruff format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff format check
        run: python -m ruff format --check .

  typecheck:
    name: Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Mypy
        run: python -m mypy src

  tests:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest -vv --durations=20 --timeout=120 --timeout-method=thread

  heavy-ocr:
    name: Heavy OCR runtime
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      HF_HOME: ${{ github.workspace }}/.hf-cache
      TRANSFORMERS_CACHE: ${{ github.workspace }}/.hf-cache/transformers
      TOKENIZERS_PARALLELISM: "false"
      MATH_HANDWRITING_LOCAL_ONLY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache Hugging Face model artifacts
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: heavy-ocr-hf-${{ runner.os }}-${{ hashFiles('requirements-heavy-ocr.txt') }}
          restore-keys: |
            heavy-ocr-hf-${{ runner.os }}-
      - name: Install system OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-fas
      - name: Install project and heavy OCR dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "torch==2.14.0" "torchvision==0.29.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-heavy-ocr.txt
      - name: Run OCR and document regression suite
        run: >
          python -m pytest -vv --durations=20
          tests/test_file_intelligence.py
          tests/test_input_ocr_geometry.py
          tests/test_math_ocr_structure.py
          tests/test_specialized_ocr.py
      - name: Prefetch and load TrOCR model
        run: |
          python - <<'PY'
          from transformers import TrOCRProcessor, VisionEncoderDecoderModel
          model_id = "microsoft/trocr-base-handwritten"
          TrOCRProcessor.from_pretrained(model_id)
          VisionEncoderDecoderModel.from_pretrained(model_id)
          print(f"TrOCR model ready: {model_id}")
          PY
      - name: Smoke-test specialized backends
        run: |
          python - <<'PY'
          from persian_math.specialized_ocr import Pix2TexMathBackend, TrOCRHandwritingBackend
          TrOCRHandwritingBackend()
          Pix2TexMathBackend()
          print("TrOCR backend construction: OK")
          print("Pix2Tex backend construction: OK")
          PY
      - name: Verify CPU-safe model runtime
        run: |
          python - <<'PY'
          import torch
          print("PyTorch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          PY
